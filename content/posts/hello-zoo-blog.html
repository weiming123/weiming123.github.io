<article class="markdown-body">
<h1>你好，前端er</h1>
<p>这是一个部署在 <strong>Gitee Pages</strong> 上的纯前端博客，没有后端服务器，没有数据库。</p>
<h2>为什么自建</h2>
<ul>
<li>完全掌控数据：文章就是 <code>content/</code> 目录下的 markdown 文件</li>
<li>零运维成本：静态托管，随写随发</li>
<li>隐私优先：阅读记录、收藏、笔记全部存在浏览器 <strong>IndexedDB</strong> 里，不上传任何数据</li>
</ul>
<h2>技术栈</h2>
<blockquote>
<p>Vue 3 + TypeScript + Vite + Pinia + SCSS</p>
</blockquote>
<p>路由使用 hash 模式，天然兼容任意静态托管子路径部署。</p>
<h2>接下来</h2>
<p>会不定期记录一些前端开发中的实践与思考，欢迎常来逛逛。</p>

</article>
</body>
</html>
